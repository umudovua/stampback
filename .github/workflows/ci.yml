name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Eyni giriş jurnalları Node.js, Chromium, Firefox və WebKit-də eyni dünya hash-ini verməlidir.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stampback/determinism-check exec playwright install --with-deps chromium firefox webkit
      - run: pnpm determinism

  # Client build-ini telefon ölçülü Chromium-da açır və ekran şəkillərini artefakt kimi saxlayır.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stampback/smoke exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tools/smoke/out/
